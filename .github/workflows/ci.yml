name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          # libportaudio2 — sounddevice (audio capture)
          # xvfb — headless X server for Qt-based tests under offscreen platform
          # libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 — PySide6 / Qt6 runtime deps
          sudo apt-get install -y libportaudio2 xvfb libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint with ruff
        run: uv run ruff check src/ tests/

      - name: Check formatting with ruff
        run: uv run ruff format --check src/ tests/

      - name: Test with pytest
        run: xvfb-run uv run pytest tests/ -v --tb=short

      - name: Benchmark latency budgets (mock pipeline)
        run: xvfb-run uv run python scripts/benchmark.py --mode mock --json benchmark-report.json

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-py${{ matrix.python-version }}
          path: benchmark-report.json
          if-no-files-found: ignore
