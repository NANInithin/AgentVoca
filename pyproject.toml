[project]
name = "agentvoca"
version = "0.3.6"
description = "A developer-first, model-agnostic voice dictation desktop app."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "NANI_NithiN", email = "naniknsk2002@gmail.com"},
]

dependencies = [
    "sounddevice>=0.5.0",
    "silero-vad>=5.0",
    "faster-whisper>=1.1.0",
    "pynput>=1.7.0",
    "PySide6>=6.8.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "PyYAML>=6.0",
    "pyautogui>=0.9.0",
    "pyperclip>=1.9.0",
    "structlog>=25.1.0",
    "pillow>=10.0.0",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.23.0.39",
    # v0.4.0 Observer OCR: local ONNX default. Rides the onnxruntime
    # already pulled in transitively by silero-vad.
    "rapidocr-onnxruntime>=1.4.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
agentvoca = "agentvoca.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
preview = false

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
