# AgentVoca config: local Whisper, deterministic cleanup (no remote LLM)
app:
  profile: technical
  mode: toggle
  debug: false

audio:
  input_device: default
  sample_rate: 16000
  vad_enabled: true
  silence_timeout_ms: 900

asr:
  provider: faster_whisper
  model: large-v3

cleanup:
  provider: rules
  style: standard

insertion:
  strategy: keyboard
  clipboard_fallback: true

hotkeys:
  toggle_recording: ctrl+space
  open_settings: ctrl+alt+comma
  insert_last_transcript: ~
  cancel: escape
